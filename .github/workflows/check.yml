name: Check research workbench
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --project plugins/research-workbench --python 3.12
      - run: uv run --frozen --project plugins/research-workbench python -m unittest discover -s tests -v
      - run: uv run --frozen --project plugins/research-workbench python scripts/smoke_mcp.py
      - run: uv run --frozen --project plugins/research-workbench python scripts/validate_package.py
